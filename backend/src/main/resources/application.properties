# Application Configuration
spring.application.name=appointment-api
server.port=8080

# Local Development - H2 Database (File-based for persistence)
spring.datasource.url=jdbc:h2:file:./data/appointmentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Console for local development
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

